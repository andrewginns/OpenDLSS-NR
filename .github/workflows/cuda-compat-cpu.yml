name: CUDA compatibility CPU checks

on:
  pull_request:
    paths:
      - 'ports/cuda-compat/**'
      - '.github/workflows/cuda-compat-cpu.yml'
  push:
    paths:
      - 'ports/cuda-compat/**'
      - '.github/workflows/cuda-compat-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install ./ports/cuda-compat
      - run: python -m unittest discover -s ports/cuda-compat/tests -p 'test_*.py' -v
      - name: Installed CLI outside checkout
        working-directory: /tmp
        run: python -m opendlss_cuda --help
